<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Мой первый веб-проект</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }

        .container {
            width: 80%;
            max-width: 700px;
            margin: 100px auto;
            background-color: white;
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            color: #5b21b6;
            font-size: 42px;
        }

        p {
            color: #555555;
            font-size: 20px;
        }

        button {
            background-color: #5b21b6;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
            Добро пожаловать!
        </h1>

        <p>
            Это мой первый полноценный
            HTML-документ.
        </p>

        <button onclick="showMessage()">
            Нажми меня
        </button>

    </div>

    <script>

        function showMessage() {
            alert("Поздравляю! JavaScript работает.");
        }

    </script>

</body>

</html>
